<div *ngIf="show" class="modal-overlay" (click)="onClose()">
  <div class="modal-container max-w-2xl" (click)="$event.stopPropagation()">
    <!-- Premium Header -->
    <div class="modal-header">
      <h2>{{ isEditMode ? 'Modify Listing' : 'Project Enrollment' }}</h2>
      <button (click)="onClose()" class="btn-close" title="Close Panel">&times;</button>
    </div>

    <!-- Modal Content -->
    <div class="modal-body">
      <form (ngSubmit)="onSubmit()" class="animate-reveal">
        
        <!-- Type Segment -->
        <div class="form-section mb-6">
          <label class="section-label">Identity Allocation</label>
          <div class="radio-track">
            <div class="radio-item">
              <input type="radio" [(ngModel)]="jobPosting.type" value="JOB" name="type" id="type-job">
              <label for="type-job" class="radio-label">Corporate Job</label>
            </div>
            <div class="radio-item">
              <input type="radio" [(ngModel)]="jobPosting.type" value="PROJECT" name="type" id="type-project">
              <label for="type-project" class="radio-label">Agile Project</label>
            </div>
          </div>
        </div>

        <!-- Meta Specification -->
        <div class="form-section mb-6">
          <label class="section-label">Descriptor Specification</label>
          
          <div class="input-group">
            <label class="input-label">Public Title</label>
            <input 
              type="text" 
              [(ngModel)]="jobPosting.title" 
              name="title"
              class="premium-input"
              placeholder="e.g. Senior Intelligence Architect" 
              required>
          </div>

          <div class="input-group">
            <label class="input-label">Core Narrative</label>
            <textarea 
              [(ngModel)]="jobPosting.description" 
              name="description"
              rows="5"
              class="premium-input premium-textarea"
              placeholder="Operational parameters and technical domain details..."
              required></textarea>
          </div>
        </div>

        <!-- Logistics & Budget -->
        <div class="grid grid-cols-2 gap-6 mb-6">
          <div class="form-section mb-0">
             <label class="section-label">Logistics</label>
             <div class="input-group">
              <label class="input-label">Category Node</label>
              <input type="text" [(ngModel)]="jobPosting.category" name="category" class="premium-input" placeholder="Technology">
            </div>
            <div class="input-group mb-0">
              <label class="input-label">Geographic Node</label>
              <input type="text" [(ngModel)]="jobPosting.location" name="location" class="premium-input" placeholder="Remote / Global">
            </div>
          </div>

          <div class="form-section mb-0">
             <label class="section-label">Compensation</label>
             <div class="input-group">
              <label class="input-label">Financial Budget (Est)</label>
              <input type="text" [(ngModel)]="jobPosting.budget" name="budget" class="premium-input" placeholder="Competitive">
            </div>
            <div class="input-group mb-0">
              <label class="input-label">Lifecycle Duration</label>
              <input type="text" [(ngModel)]="jobPosting.duration" name="duration" class="premium-input" placeholder="Long Term">
            </div>
          </div>
        </div>

        <!-- Technical Stack Archive -->
        <div class="form-section mb-6">
          <label class="section-label">Technical Stack & Capability</label>
          <div class="flex gap-2">
            <input 
              type="text" 
              [(ngModel)]="techStackInput" 
              name="techStackInput"
              (keyup.enter)="addTechStack()"
              class="premium-input"
              placeholder="e.g. Angular, Go, Rust (comma-separated)">
            <button type="button" (click)="addTechStack()" class="btn-pill btn-primary text-xs py-2 px-6">Add</button>
          </div>
          <div class="chip-container">
            <span *ngFor="let tech of jobPosting.techStack" class="premium-chip">
              {{ tech }}
              <span (click)="removeTechStack(tech)" class="btn-remove-chip">×</span>
            </span>
          </div>
        </div>

        <!-- Requirements Matrix -->
        <div class="form-section mb-6">
          <label class="section-label">Requirements Matrix</label>
          <div class="flex gap-2">
            <input 
              type="text" 
              [(ngModel)]="requirementInput" 
              name="requirementInput"
              (keyup.enter)="addRequirement()"
              class="premium-input"
              placeholder="e.g. Advanced AI Integration experience">
            <button type="button" (click)="addRequirement()" class="btn-pill btn-primary text-xs py-2 px-6">Add</button>
          </div>
          <div class="chip-container">
            <span *ngFor="let req of getRequirementsArray()" class="premium-chip !bg-emerald-50 !text-emerald-600 !border-emerald-100">
              {{ req }}
              <span (click)="removeRequirement(req)" class="btn-remove-chip !text-emerald-300 hover:!text-emerald-600">×</span>
            </span>
          </div>
        </div>

        <!-- Error Handler Layer -->
        <div *ngIf="errorMessage" class="mb-4 p-4 bg-rose-50 border-l-4 border-rose-500 rounded-r-2xl text-rose-700 text-[11px] font-black uppercase tracking-widest animate-pulse">
          ERROR // {{ errorMessage }}
        </div>
      </form>
    </div>

    <!-- Final Authorization -->
    <div class="modal-footer">
      <button (click)="onClose()" class="btn-pill btn-secondary">Discard</button>
      <button (click)="onSubmit()" [disabled]="isSubmitting" class="btn-pill btn-primary">
        {{ isSubmitting ? 'Syncing...' : (isEditMode ? 'Authorize Update' : 'Initialize Listing') }}
      </button>
    </div>
  </div>
</div>
