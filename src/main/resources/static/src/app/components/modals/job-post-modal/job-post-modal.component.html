<div *ngIf="show" class="modal-overlay fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8"
  (click)="onClose()">

  <div class="glass-modal w-full max-w-4xl" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="modal-title">
            {{ isEditMode ? 'Modify Initiative' : 'New Listing' }}
          </h3>
          <p class="modal-subtitle">
            {{ isEditMode ? 'Sync changes to the live marketplace registry' : 'Define a new career opportunity or
            collaborative project' }}
          </p>
        </div>
        <button (click)="onClose()"
          class="h-14 w-14 flex items-center justify-center bg-slate-50 rounded-full hover:bg-slate-100 transition-colors text-slate-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="modal-content">
      <form (ngSubmit)="onSubmit()" id="jobPostForm">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

          <div class="space-y-8">
            <!-- Type -->
            <div class="input-group">
              <label class="input-label">Offering classification</label>
              <div class="type-toggle">
                <button type="button" (click)="jobPosting.type = 'JOB'" [class.active]="jobPosting.type === 'JOB'"
                  class="type-btn">Full Time Job</button>
                <button type="button" (click)="jobPosting.type = 'PROJECT'"
                  [class.active]="jobPosting.type === 'PROJECT'" class="type-btn">Project / Gig</button>
              </div>
            </div>

            <!-- Title -->
            <div class="input-group">
              <label class="input-label">Strategic Title</label>
              <input type="text" [(ngModel)]="jobPosting.title" name="title" class="premium-input"
                placeholder="e.g., Lead Systems Architect" required>
            </div>

            <!-- Dynamic Two Col Grid local -->
            <div class="grid grid-cols-2 gap-4">
              <div class="input-group">
                <label class="input-label">Category</label>
                <input type="text" [(ngModel)]="jobPosting.category" name="category" class="premium-input"
                  placeholder="e.g., Core API">
              </div>
              <div class="input-group">
                <label class="input-label">Geography</label>
                <input type="text" [(ngModel)]="jobPosting.location" name="location" class="premium-input"
                  placeholder="e.g., Remote / NCR">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="input-group">
                <label class="input-label">Compensation Range</label>
                <input type="text" [(ngModel)]="jobPosting.budget" name="budget" class="premium-input"
                  placeholder="e.g., 20 - 30 LPA">
              </div>
              <div class="input-group">
                <label class="input-label">Timeframe</label>
                <input type="text" [(ngModel)]="jobPosting.duration" name="duration" class="premium-input"
                  placeholder="e.g., Indefinite">
              </div>
            </div>
          </div>

          <div class="space-y-8">
            <!-- Description -->
            <div class="input-group">
              <label class="input-label">Scope & Narrative</label>
              <textarea [(ngModel)]="jobPosting.description" name="description" rows="6"
                class="premium-input !resize-none"
                placeholder="Elaborate on objectives, workflow integration, and cultural requirements..."
                required></textarea>
            </div>

            <!-- Tech Stack -->
            <div class="input-group">
              <label class="input-label">Tech Stack Inventory</label>
              <div class="relative">
                <input type="text" [(ngModel)]="techStackInput" name="techStackInput" (keyup.enter)="addTechStack()"
                  class="premium-input pr-16" placeholder="e.g., Angular, Spring Boot">
                <button type="button" (click)="addTechStack()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 h-10 w-10 bg-indigo-600/10 text-indigo-600 rounded-xl hover:bg-indigo-600 hover:text-white transition-all font-black">
                  +
                </button>
              </div>
              <div class="tag-container mt-4">
                <span *ngFor="let tech of jobPosting.techStack" class="pill-tag">
                  {{ tech }}
                  <span (click)="removeTechStack(tech)" class="remove-tag">✕</span>
                </span>
              </div>
            </div>

            <!-- Requirements -->
            <div class="input-group">
              <label class="input-label">Critical Requirements</label>
              <div class="relative">
                <input type="text" [(ngModel)]="requirementInput" name="requirementInput"
                  (keyup.enter)="addRequirement()" class="premium-input pr-16"
                  placeholder="e.g., 5+ Yrs DevOps, Masters Degree">
                <button type="button" (click)="addRequirement()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 h-10 w-10 bg-emerald-600/10 text-emerald-600 rounded-xl hover:bg-emerald-600 hover:text-white transition-all font-black">
                  +
                </button>
              </div>
              <div class="tag-container mt-4">
                <span *ngFor="let req of getRequirementsArray()"
                  class="pill-tag !bg-emerald-50 !text-emerald-700 !border-emerald-100">
                  {{ req }}
                  <span (click)="removeRequirement(req)" class="remove-tag">✕</span>
                </span>
              </div>
            </div>

            <div *ngIf="isEditMode" class="input-group">
              <label class="input-label">Availability Lifecycle</label>
              <select [(ngModel)]="jobPosting.status" name="status" class="premium-input appearance-none">
                <option value="OPEN">MARKET ACTIVE</option>
                <option value="CLOSED">SUSPENDED</option>
                <option value="FILLED">POSITION FILLED</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Messaging -->
        <div *ngIf="errorMessage"
          class="mt-8 p-6 bg-rose-50 border border-rose-100 rounded-3xl text-rose-500 font-bold uppercase tracking-widest text-[10px] animate-bounce">
          ⚠️ {{ errorMessage }}
        </div>
        <div *ngIf="successMessage"
          class="mt-8 p-6 bg-emerald-50 border border-emerald-100 rounded-3xl text-emerald-600 font-bold uppercase tracking-widest text-[10px]">
          ✅ {{ successMessage }}
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button type="button" (click)="onClose()" class="btn-cancel">
        Discard Session
      </button>
      <button type="submit" form="jobPostForm" [disabled]="isSubmitting" class="btn-submit">
        <span *ngIf="isSubmitting">Transmitting...</span>
        <span *ngIf="!isSubmitting">{{ isEditMode ? 'Authorize Update' : 'Initialize Listing' }}</span>
      </button>
    </div>
  </div>
</div>
