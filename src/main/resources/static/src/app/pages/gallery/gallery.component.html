<section class="gallery-page max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="mb-6">
    <h1 class="text-3xl font-black text-slate-900 tracking-tight">Gallery</h1>
    <p class="text-slate-500 mt-2">All images uploaded from the admin gallery section.</p>
  </div>

  <div *ngIf="isLoading" class="loading-wrap">
    <div class="spinner"></div>
    <p>Loading gallery...</p>
  </div>

  <div *ngIf="!isLoading && images.length === 0" class="empty-wrap">
    <p>No gallery images available yet.</p>
  </div>

  <div *ngIf="!isLoading && images.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
    <div *ngFor="let image of images" class="gallery-card">
      <img [src]="image" alt="Gallery image" class="gallery-image">
    </div>
  </div>
</section>
