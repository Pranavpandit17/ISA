<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
  <button *ngIf="currentUser" (click)="onNavigate('DASHBOARD')" class="mb-6 text-slate-500 hover:text-slate-800 flex items-center gap-1 font-medium transition-colors">
    ← Back to Dashboard
  </button>
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <h2 class="text-2xl font-bold text-slate-900">Member Directory</h2>
    <div class="flex flex-wrap gap-2 w-full md:w-auto">
      <input type="text" [(ngModel)]="dirSearch" (ngModelChange)="filterMembers()" placeholder="Search members..." class="dir-search pl-3 pr-4 py-2 border border-slate-300 rounded-lg w-full md:w-64">
      <select [(ngModel)]="dirIndustryFilter" (ngModelChange)="filterMembers()" class="dir-select py-2 pl-3 pr-8 border border-slate-300 rounded-lg text-sm bg-white md:min-w-[180px]">
        <option value="">All Industries</option>
        <option *ngFor="let ind of industryOptions" [value]="ind">{{ ind.length > 70 ? (ind | slice:0:70) + '…' : ind }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="currentUser?.type !== 'PREMIUM' && currentUser?.type !== 'ADMIN' && currentUser?.role !== 'admin'" class="text-center py-16 bg-white rounded-xl border border-slate-200 shadow-sm">
    <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">🔒</div>
    <h3 class="text-xl font-bold text-slate-900 mb-2">Premium Feature</h3>
    <p class="text-slate-500 max-w-md mx-auto mb-6">Upgrade your membership to access the full directory of IT leaders and connect directly.</p>
    <button (click)="onOpenPayment()" class="px-6 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 font-medium">Unlock Directory</button>
  </div>

  <div *ngIf="canViewDirectoryContent()" class="space-y-4">
    <div *ngIf="isLoading" class="text-center py-16 text-slate-500">Loading directory…</div>
    <div *ngIf="!isLoading && loadError" class="text-center py-8 text-red-600 text-sm">{{ loadError }}</div>

    <div *ngIf="!isLoading && !loadError" class="dir-grid">
      <article *ngFor="let row of filteredRows" class="dir-card">
        <div class="dir-card-top">
          <img [src]="row.avatarImage" class="dir-avatar" width="64" height="64" alt="" loading="lazy">
          <button type="button" (click)="connectWith(row.member.id)" class="dir-connect">Connect</button>
        </div>
        <h3 class="dir-name">{{ row.member.name }}</h3>
        <p class="dir-title">{{ row.displayTitle }}</p>
        <p class="dir-company">{{ row.member.company }}</p>
        <p class="dir-tagline">{{ row.tagline }}</p>
      </article>
    </div>

    <p *ngIf="!isLoading && !loadError && filteredRows.length === 0" class="text-center text-slate-500 py-8">
      No members match your filters.
    </p>
  </div>
</div>
