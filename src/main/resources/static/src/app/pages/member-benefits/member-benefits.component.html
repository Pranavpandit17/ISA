<section class="member-benefits-page max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="mb-6">
    <h1 class="text-3xl font-black text-slate-900 tracking-tight">Member Benefits</h1>
    <p class="text-slate-500 mt-2">Explore the benefits available to ISA members.</p>
  </div>

  <div *ngIf="isLoading" class="loading-wrap">
    <div class="spinner"></div>
    <p>Loading member benefits...</p>
  </div>

  <div *ngIf="!isLoading && images.length === 0" class="empty-wrap">
    <p>No member benefit images available yet.</p>
  </div>

  <div *ngIf="!isLoading && images.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
    <div *ngFor="let image of images" class="benefit-card">
      <img [src]="image" alt="Member benefit" class="benefit-image">
    </div>
  </div>
</section>
