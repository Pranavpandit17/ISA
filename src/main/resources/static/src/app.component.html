<div class="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col">
  <!-- NAVIGATION -->
  <app-navigation
    [currentView]="currentView"
    [currentUser]="currentUser"
    (navigate)="navigate($event)"
    (openAuth)="openAuthModal($event)"
    (logout)="logout()">
  </app-navigation>

  <!-- MAIN CONTENT AREA -->
  <main class="fade-in flex-grow">
    <app-home
      *ngIf="currentView === 'HOME'"
      (navigate)="navigate($event)"
      (openAuth)="openAuthModal($event)"
      (openPayment)="openPaymentModal()"
      (viewEvent)="viewEventDetail($event)"
      (loginRequiredForEvent)="handleLoginRequiredForEvent($event)">
    </app-home>

    <app-dashboard
      *ngIf="currentView === 'DASHBOARD'"
      (navigate)="navigate($event)"
      (viewEvent)="viewEventDetail($event)">
    </app-dashboard>

    <app-admin-dashboard
      *ngIf="currentView === 'ADMIN_DASHBOARD'"
      (navigate)="navigate($event)">
    </app-admin-dashboard>

    <app-directory
      *ngIf="currentView === 'DIRECTORY'"
      (navigate)="navigate($event)"
      (openPayment)="openPaymentModal()">
    </app-directory>

    <app-events
      *ngIf="currentView === 'EVENTS'"
      (navigate)="navigate($event)"
      (viewEvent)="viewEventDetail($event)">
    </app-events>

    <app-event-detail
      *ngIf="currentView === 'EVENT_DETAIL' && selectedEvent"
      [event]="selectedEvent"
      (navigate)="navigate($event)"
      (register)="registerForEvent($event)"
      (openPayment)="openPaymentModal()">
    </app-event-detail>

    <app-bench
      *ngIf="currentView === 'BENCH'"
      (navigate)="navigate($event)"
      (openPayment)="openPaymentModal()">
    </app-bench>

    <app-blogs
      *ngIf="currentView === 'BLOGS'"
      (navigate)="navigate($event)">
    </app-blogs>

    <app-profile-edit
      *ngIf="currentView === 'PROFILE_EDIT'"
      (navigate)="navigate($event)">
    </app-profile-edit>

    <app-resource-post
      *ngIf="currentView === 'RESOURCE_POST'"
      (navigate)="navigate($event)">
    </app-resource-post>

    <app-project-post
      *ngIf="currentView === 'PROJECT_POST'"
      (navigate)="navigate($event)">
    </app-project-post>

    <app-blog-create
      *ngIf="currentView === 'BLOG_CREATE'"
      (navigate)="navigate($event)">
    </app-blog-create>

    <app-member-management
      *ngIf="currentView === 'MEMBER_MANAGEMENT'">
    </app-member-management>

    <app-event-management
      *ngIf="currentView === 'EVENT_MANAGEMENT'"
      (navigate)="navigate($event)">
    </app-event-management>

    <app-event-create
      *ngIf="currentView === 'EVENT_CREATE'"
      (navigate)="navigate($event)">
    </app-event-create>
  </main>

  <!-- FOOTER -->
  <app-footer (navigate)="navigate($event)"></app-footer>

  <!-- MODALS -->
  <app-auth-modal
    [show]="showAuthModal"
    [mode]="authMode"
    (close)="closeAuthModal()"
    (success)="onAuthSuccess()">
  </app-auth-modal>

  <app-payment-modal
    [show]="showPaymentModal"
    [paymentType]="selectedEvent && ((selectedEvent.pricingType === 'PAID' || selectedEvent.pricingType === 'DISCOUNTED') || (selectedEvent.memberPrice && selectedEvent.memberPrice > 0) || (selectedEvent.nonMemberPrice && selectedEvent.nonMemberPrice > 0) || (selectedEvent.price && selectedEvent.price > 0)) ? 'EVENT' : 'MEMBERSHIP'"
    [event]="selectedEvent"
    [quantity]="selectedEvent?.quantity || 1"
    (close)="closePaymentModal()"
    (success)="onPaymentSuccess($event)">
  </app-payment-modal>

  <!-- Event Detail / Booking Modal (shared for Home & Dashboard) -->
  <app-event-detail-modal
    [show]="showEventDetailModal"
    [event]="selectedEvent"
    (close)="closeEventDetailModal()"
    (registered)="onEventRegistered()"
    (openPayment)="onEventPaymentRequest($event)">
  </app-event-detail-modal>
</div>
