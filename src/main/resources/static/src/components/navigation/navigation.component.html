<nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-slate-200 shadow-sm transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-20">
      <div class="flex items-center cursor-pointer" (click)="onNavigate('HOME')">
        <div class="flex-shrink-0 flex items-center gap-2">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">I</div>
          <div class="flex flex-col">
            <span class="font-bold text-xl tracking-tight text-slate-900 leading-none">ISA</span>
            <span class="text-xs font-semibold text-blue-600 tracking-widest uppercase">Connect</span>
          </div>
        </div>
        
        <div class="hidden md:ml-10 md:flex md:space-x-8">
          <a *ngFor="let item of navItems" 
             (click)="onNavigate(item.view)"
             [class.text-blue-600]="currentView === item.view"
             [class.border-blue-600]="currentView === item.view"
             class="cursor-pointer border-transparent text-slate-600 hover:text-blue-600 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            {{ item.label }}
          </a>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div *ngIf="!currentUser; else loggedInMenu" class="flex items-center gap-3">
          <button (click)="onOpenAuth('LOGIN')" class="text-slate-600 hover:text-blue-600 font-medium text-sm transition-colors">Log in</button>
          <button (click)="onOpenAuth('REGISTER')" class="bg-blue-600 text-white px-5 py-2.5 rounded-full text-sm font-bold hover:bg-blue-700 transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">Join ISA</button>
        </div>
        
        <ng-template #loggedInMenu>
          <div class="flex items-center gap-3">
            <div class="hidden md:flex flex-col items-end mr-2 cursor-pointer" (click)="onNavigate(currentUser?.type === 'ADMIN' ? 'ADMIN_DASHBOARD' : 'DASHBOARD')">
              <span class="text-sm font-semibold text-slate-800">{{ currentUser?.name }}</span>
              <span class="text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider font-bold" 
                    [ngClass]="{
                      'bg-amber-100 text-amber-700': currentUser?.type === 'PREMIUM',
                      'bg-slate-100 text-slate-600': currentUser?.type === 'REGULAR',
                      'bg-purple-100 text-purple-700': currentUser?.type === 'ADMIN'
                    }">
                {{ currentUser?.type }}
              </span>
            </div>
            <div class="h-10 w-10 rounded-full bg-slate-200 flex items-center justify-center overflow-hidden border-2 border-white shadow-sm cursor-pointer" (click)="onNavigate(currentUser?.type === 'ADMIN' ? 'ADMIN_DASHBOARD' : 'DASHBOARD')">
              <img [src]="currentUser?.image" alt="User" class="h-full w-full object-cover">
            </div>
            <button (click)="onLogout()" class="text-sm text-slate-500 hover:text-red-600 font-medium ml-2 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
