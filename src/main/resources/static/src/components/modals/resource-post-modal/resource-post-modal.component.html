<div *ngIf="show" class="fixed inset-0 z-50 overflow-y-auto" (click)="onClose()">
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
    <div class="fixed inset-0 transition-opacity bg-black bg-opacity-50" aria-hidden="true"></div>
    
    <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-3xl sm:w-full max-h-[90vh] overflow-y-auto" (click)="$event.stopPropagation()">
      <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
        <!-- Header -->
        <div class="flex justify-between items-start mb-6">
          <h2 class="text-2xl font-bold text-slate-900">{{ isEditMode ? 'Edit Resource' : 'Post Available Bench Resource' }}</h2>
          <button (click)="onClose()" class="text-slate-400 hover:text-slate-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        
        <!-- Error/Success Messages -->
        <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-md text-red-700 text-sm">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-md text-green-700 text-sm">
          {{ successMessage }}
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-5">
          <!-- Required Fields -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Role Title *</label>
            <input 
              [(ngModel)]="resource.role" 
              name="role"
              type="text" 
              placeholder="e.g. Senior React Developer" 
              class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500"
              required>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Tech Stack *</label>
            <input 
              [(ngModel)]="resource.stack" 
              name="stack"
              type="text" 
              placeholder="e.g. React, Node.js, AWS" 
              class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500"
              required>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Experience *</label>
              <input 
                [(ngModel)]="resource.experience" 
                name="experience"
                type="text" 
                placeholder="e.g. 5 Years, Senior Level" 
                class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500"
                required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Availability *</label>
              <select 
                [(ngModel)]="resource.availability" 
                name="availability"
                class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 bg-white"
                required>
                <option value="Immediate">Immediate</option>
                <option value="1 Week">1 Week</option>
                <option value="2 Weeks">2 Weeks</option>
                <option value="1 Month">1 Month</option>
                <option value="2 Months">2 Months</option>
                <option value="3 Months">3 Months</option>
              </select>
            </div>
          </div>

          <!-- Description -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
            <textarea 
              [(ngModel)]="resource.description" 
              name="description"
              rows="4" 
              placeholder="Describe the resource, their expertise, and what they can bring to projects..."
              class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
          </div>

          <!-- Skills -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Skills (comma-separated)</label>
            <input 
              [(ngModel)]="skillsInput" 
              name="skills"
              type="text" 
              placeholder="e.g. JavaScript, React, Node.js, AWS, Docker" 
              class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
            <p class="mt-1 text-xs text-slate-500">Separate multiple skills with commas</p>
          </div>

          <!-- Rate and Location -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Hourly Rate</label>
              <div class="flex">
                <select 
                  [(ngModel)]="resource.currency" 
                  name="currency"
                  class="border border-slate-300 rounded-l-lg py-2 px-3 bg-slate-50 focus:ring-indigo-500 focus:border-indigo-500">
                  <option value="USD">USD</option>
                  <option value="INR">INR</option>
                  <option value="EUR">EUR</option>
                </select>
                <input 
                  [(ngModel)]="resource.hourlyRate" 
                  name="hourlyRate"
                  type="number" 
                  step="0.01"
                  placeholder="e.g. 50" 
                  class="flex-1 border border-slate-300 rounded-r-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Location</label>
              <input 
                [(ngModel)]="resource.location" 
                name="location"
                type="text" 
                placeholder="e.g. New York, USA" 
                class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
          </div>

          <!-- Remote Work -->
          <div class="flex items-center">
            <input 
              [(ngModel)]="resource.isRemote" 
              name="isRemote"
              type="checkbox" 
              id="isRemote"
              class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded">
            <label for="isRemote" class="ml-2 block text-sm text-slate-700">
              Available for remote work
            </label>
          </div>

          <!-- Contact Information -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Contact Email</label>
              <input 
                [(ngModel)]="resource.contactEmail" 
                name="contactEmail"
                type="email" 
                placeholder="contact@example.com" 
                class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Contact Phone</label>
              <input 
                [(ngModel)]="resource.contactPhone" 
                name="contactPhone"
                type="tel" 
                placeholder="+1 234 567 8900" 
                class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
          </div>

          <!-- Additional Information -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Certifications</label>
            <textarea 
              [(ngModel)]="resource.certifications" 
              name="certifications"
              rows="2" 
              placeholder="List relevant certifications..."
              class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Previous Projects</label>
            <textarea 
              [(ngModel)]="resource.previousProjects" 
              name="previousProjects"
              rows="3" 
              placeholder="Brief description of previous projects or experience..."
              class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
          </div>

          <!-- Expiry Date -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Expiry Date (Optional)</label>
            <input 
              [(ngModel)]="resource.expiryDate" 
              name="expiryDate"
              type="date" 
              class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
            <p class="mt-1 text-xs text-slate-500">Leave empty if resource is available indefinitely</p>
          </div>

          <!-- Submit Button -->
          <div class="pt-4 flex justify-end gap-3">
            <button 
              type="button"
              (click)="onClose()"
              class="px-4 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50">
              Cancel
            </button>
            <button 
              type="submit"
              [disabled]="isSubmitting"
              class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed font-medium">
              <span *ngIf="isSubmitting">{{ isEditMode ? 'Updating...' : 'Posting...' }}</span>
              <span *ngIf="!isSubmitting">{{ isEditMode ? 'Update Resource' : 'Post Resource' }}</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
