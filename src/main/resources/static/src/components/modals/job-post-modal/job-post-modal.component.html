<div *ngIf="show" class="fixed inset-0 z-50 overflow-y-auto" (click)="onClose()">
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
    <div class="fixed inset-0 transition-opacity bg-black bg-opacity-50" aria-hidden="true"></div>
    
    <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-3xl sm:w-full" (click)="$event.stopPropagation()">
      <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-medium text-slate-900">
            {{ isEditMode ? 'Edit Job/Project' : 'Post Job/Project' }}
          </h3>
          <button (click)="onClose()" class="text-slate-400 hover:text-slate-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>

        <form (ngSubmit)="onSubmit()">
          <!-- Type Selection -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-2">Type</label>
            <div class="flex gap-4">
              <label class="flex items-center">
                <input type="radio" [(ngModel)]="jobPosting.type" value="JOB" name="type" class="mr-2">
                <span>Job</span>
              </label>
              <label class="flex items-center">
                <input type="radio" [(ngModel)]="jobPosting.type" value="PROJECT" name="type" class="mr-2">
                <span>Project</span>
              </label>
            </div>
          </div>

          <!-- Title -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Title *</label>
            <input 
              type="text" 
              [(ngModel)]="jobPosting.title" 
              name="title"
              class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="e.g., Senior Full Stack Developer" 
              required>
          </div>

          <!-- Description -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Description *</label>
            <textarea 
              [(ngModel)]="jobPosting.description" 
              name="description"
              rows="5"
              class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Describe the job/project requirements, responsibilities, etc."
              required></textarea>
          </div>

          <!-- Category and Location -->
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
              <input 
                type="text" 
                [(ngModel)]="jobPosting.category" 
                name="category"
                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="e.g., Software Development">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Location</label>
              <input 
                type="text" 
                [(ngModel)]="jobPosting.location" 
                name="location"
                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="e.g., Remote, Indore">
            </div>
          </div>

          <!-- Budget and Duration -->
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Budget</label>
              <input 
                type="text" 
                [(ngModel)]="jobPosting.budget" 
                name="budget"
                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="e.g., ₹5L - ₹8L">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Duration</label>
              <input 
                type="text" 
                [(ngModel)]="jobPosting.duration" 
                name="duration"
                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="e.g., 3 Months">
            </div>
          </div>

          <!-- Tech Stack -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Tech Stack</label>
            <div class="flex gap-2 mb-2">
              <input 
                type="text" 
                [(ngModel)]="techStackInput" 
                name="techStackInput"
                (keyup.enter)="addTechStack()"
                class="flex-1 px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="e.g., Angular, Node.js (comma-separated)">
              <button 
                type="button"
                (click)="addTechStack()"
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                Add
              </button>
            </div>
            <div class="flex flex-wrap gap-2">
              <span 
                *ngFor="let tech of jobPosting.techStack" 
                class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-blue-100 text-blue-800">
                {{ tech }}
                <button 
                  type="button"
                  (click)="removeTechStack(tech)"
                  class="ml-2 text-blue-600 hover:text-blue-800">
                  ×
                </button>
              </span>
            </div>
          </div>

          <!-- Requirements -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Requirements</label>
            <div class="flex gap-2 mb-2">
              <input 
                type="text" 
                [(ngModel)]="requirementInput" 
                name="requirementInput"
                (keyup.enter)="addRequirement()"
                class="flex-1 px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="e.g., 5+ years experience, Bachelor's degree (comma-separated)">
              <button 
                type="button"
                (click)="addRequirement()"
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                Add
              </button>
            </div>
            <div class="flex flex-wrap gap-2">
              <span 
                *ngFor="let req of getRequirementsArray()" 
                class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-green-100 text-green-800">
                {{ req }}
                <button 
                  type="button"
                  (click)="removeRequirement(req)"
                  class="ml-2 text-green-600 hover:text-green-800">
                  ×
                </button>
              </span>
            </div>
            <p class="text-xs text-slate-500 mt-1">Add specific requirements, qualifications, or skills needed</p>
          </div>

          <!-- Status (for edit mode) -->
          <div *ngIf="isEditMode" class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
            <select 
              [(ngModel)]="jobPosting.status" 
              name="status"
              class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="OPEN">Open</option>
              <option value="CLOSED">Closed</option>
              <option value="FILLED">Filled</option>
            </select>
          </div>

          <!-- Error/Success Messages -->
          <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-md text-red-700 text-sm">
            {{ errorMessage }}
          </div>
          <div *ngIf="successMessage" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-md text-green-700 text-sm">
            {{ successMessage }}
          </div>

          <!-- Actions -->
          <div class="flex justify-end gap-3 mt-6">
            <button 
              type="button"
              (click)="onClose()"
              class="px-4 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50">
              Cancel
            </button>
            <button 
              type="submit"
              [disabled]="isSubmitting"
              class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
              <span *ngIf="isSubmitting">Saving...</span>
              <span *ngIf="!isSubmitting">{{ isEditMode ? 'Update' : 'Post' }}</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
