<div *ngIf="show" class="fixed inset-0 z-50 overflow-y-auto">
  <!-- Backdrop -->
  <div class="flex items-center justify-center min-h-screen px-4 bg-black/50 backdrop-blur-sm">

    <!-- Modal -->
    <div
      class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 relative"
      (click)="$event.stopPropagation()"
    >
      <!-- Close Button -->
      <button
        type="button"
        class="absolute top-3 right-3 text-gray-500 hover:text-black text-xl font-bold"
        (click)="onClose()"
      >
        &times;
      </button>

      <h3 class="text-lg font-bold mb-4">
        {{ mode === 'LOGIN' ? 'Welcome Back' : 'Apply for ISA Membership' }}
      </h3>

      <div class="space-y-4 max-h-[70vh] overflow-y-auto pr-2">

        <ng-container *ngIf="mode === 'LOGIN'">
          <div>
            <label class="block text-sm font-medium mb-1">Email Address</label>
            <input
              type="email"
              [(ngModel)]="loginEmail"
              class="w-full border p-2 rounded"
              placeholder="Enter your email">
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input
              type="password"
              [(ngModel)]="loginPassword"
              class="w-full border p-2 rounded"
              placeholder="Enter your password">
          </div>
        </ng-container>

        <ng-container *ngIf="mode === 'REGISTER'">
          <!-- Registration Fields -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Company Name <span style="color: red;">*</span></label>
              <input [(ngModel)]="regData.company" type="text" class="w-full border p-2 rounded" required>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Website</label>
              <input [(ngModel)]="regData.website" type="text" class="w-full border p-2 rounded">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Director Name(s)<span style="color: red;">*</span></label>
            <input [(ngModel)]="regData.applicantName" type="text" placeholder="Full Name" class="w-full border p-2 rounded" required>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Email (Official)<span style="color: red;">*</span></label>
              <input [(ngModel)]="regData.email" type="email" class="w-full border p-2 rounded" required>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Phone Number<span style="color: red;">*</span></label>
              <input [(ngModel)]="regData.phone" type="text" class="w-full border p-2 rounded" required>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Team Size<span style="color: red;">*</span></label>
              <select [(ngModel)]="regData.teamSize" class="w-full border p-2 rounded bg-white" required>
                <option value="1-10">1-10</option>
                <option value="11-50">11-50</option>
                <option value="51-200">51-200</option>
                <option value="200+">200+</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Domain/Industry<span style="color: red;">*</span></label>
              <select [(ngModel)]="regData.industry" class="w-full border p-2 rounded bg-white" required>
                <option value="SaaS">SaaS</option>
                <option value="Fintech">Fintech</option>
                <option value="Services">Services</option>
                <option value="HealthTech">HealthTech</option>
                <option value="EdTech">EdTech</option>
                <option value="AI">AI</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Technology Stack (Comma separated)</label>
            <input [(ngModel)]="regData.techStack" type="text" placeholder="e.g. Java, Angular, AWS" class="w-full border p-2 rounded">
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Registered Office Address<span style="color: red;">*</span></label>
            <textarea [(ngModel)]="regData.address" rows="2" class="w-full border p-2 rounded" required></textarea>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Create Password<span style="color: red;">*</span></label>
            <input [(ngModel)]="regData.password" type="password" class="w-full border p-2 rounded" required>
          </div>
        </ng-container>

        <div class="error-message text-sm text-red-600" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="success-message" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <div class="flex gap-3 items-center">
          <button
            (click)="handleAuth()"
            class="flex-1 bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 disabled:opacity-50"
            [disabled]="isLoading"
          >
            <span *ngIf="!isLoading">
              {{ mode === 'LOGIN' ? 'Sign In' : 'Submit Application' }}
            </span>
            <span *ngIf="isLoading">
              {{ mode === 'LOGIN' ? 'Signing in...' : 'Submitting...' }}
            </span>
          </button>

          <button
            *ngIf="mode === 'LOGIN'"
            type="button"
            (click)="switchToJoinIsa()"
            class="px-4 py-2 border border-blue-600 text-blue-600 rounded font-semibold hover:bg-blue-50 whitespace-nowrap"
          >
            Join ISA
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
