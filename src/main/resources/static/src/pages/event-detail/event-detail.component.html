<div class="max-w-4xl mx-auto px-4 py-8 w-full">
  <button (click)="onNavigate('EVENTS')" class="mb-4 text-blue-600">← Back</button>
  <div class="bg-white p-8 rounded shadow" *ngIf="event">
    <h1 class="text-3xl font-bold mb-4">{{ event.title }}</h1>
    <div class="flex gap-4 mb-6 text-sm text-slate-500">
      <span>📅 {{ event.date | date:'medium' }}</span>
      <span>📍 {{ event.location }}</span>
    </div>
    <p class="text-slate-600 mb-6">{{ event.description }}</p>
    
    <div class="bg-slate-50 p-6 rounded-lg border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <div>
          <span class="text-sm text-slate-500">Price</span>
          <div class="text-2xl font-bold">{{ event.price > 0 ? (event.price | currency:'INR') : 'Free' }}</div>
        </div>
        <!-- Logic: Premium get free/included, Regular pays -->
        <div *ngIf="currentUser?.type === 'REGULAR' && event.price > 0" class="text-right">
          <span class="text-xs text-amber-600 font-bold">Regular Member Fee Applies</span>
        </div>
      </div>
      
      <button (click)="onRegister()" 
              class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold shadow hover:bg-blue-700 transition-colors">
        {{ isEventPaidForUser() ? 'Pay & Register' : 'Register Now' }}
      </button>
    </div>
  </div>
</div>
