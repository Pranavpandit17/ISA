<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
  <button *ngIf="currentUser" (click)="onNavigate('DASHBOARD')" class="mb-6 text-slate-500 hover:text-slate-800 flex items-center gap-1 font-medium transition-colors">
    ← Back to Dashboard
  </button>
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold">Knowledge Hub</h2>
    <button (click)="onNavigate('BLOG_CREATE')" class="px-4 py-2 bg-slate-900 text-white rounded">Write Article</button>
  </div>
  <div class="grid gap-6 md:grid-cols-3">
    <div *ngFor="let post of blogPosts" class="bg-white p-6 rounded shadow border border-slate-200">
      <div class="text-xs text-blue-600 font-bold mb-2">{{ post.category }}</div>
      <h3 class="font-bold text-lg mb-2">{{ post.title }}</h3>
      <p class="text-sm text-slate-500 line-clamp-2">{{ post.excerpt }}</p>
    </div>
  </div>
</div>
