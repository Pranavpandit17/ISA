<div class="max-w-2xl mx-auto px-4 py-8">
  <button (click)="onNavigate('DASHBOARD')" class="mb-6 text-slate-500 hover:text-slate-800 flex items-center gap-1 font-medium transition-colors">
    ← Back to Dashboard
  </button>
  <div class="bg-white shadow rounded-lg border border-slate-200 p-8">
    <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-4">Post Project Requirement</h2>
    <div class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Project Title</label>
        <input [(ngModel)]="newProject.title" type="text" placeholder="e.g. E-commerce App Development" class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Estimated Budget</label>
        <input [(ngModel)]="newProject.budget" type="text" placeholder="e.g. ₹ 5L - ₹ 8L" class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
        <textarea [(ngModel)]="newProject.description" rows="4" placeholder="Describe the project requirements..." class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Required Tech Stack (Comma separated)</label>
        <input [(ngModel)]="newProject.techStackRaw" type="text" placeholder="e.g. Flutter, Firebase, Node.js" class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <button (click)="submitProject()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 shadow-md mt-4 transition-all">Post Project</button>
    </div>
  </div>
</div>
