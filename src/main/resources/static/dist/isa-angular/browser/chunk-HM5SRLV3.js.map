<div class="max-w-2xl mx-auto px-4 py-8">
  <button (click)="onNavigate('BLOGS')" class="mb-6 text-slate-500 hover:text-slate-800 flex items-center gap-1 font-medium transition-colors">
    ← Back to Blogs
  </button>
  <div class="bg-white shadow rounded-lg border border-slate-200 p-8">
    <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-4">Write New Article</h2>
    <div class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Article Title</label>
        <input type="text" [(ngModel)]="newBlog.title" class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-blue-500 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
        <select [(ngModel)]="newBlog.category" class="block w-full border border-slate-300 rounded-lg py-2 px-3 bg-white focus:ring-blue-500 focus:border-blue-500">
          <option>Technology</option><option>Business</option><option>Startups</option><option>Policy</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Short Excerpt</label>
        <input type="text" [(ngModel)]="newBlog.excerpt" class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-blue-500 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Content</label>
        <textarea [(ngModel)]="newBlog.content" rows="6" class="block w-full border border-slate-300 rounded-lg py-2 px-3 focus:ring-blue-500 focus:border-blue-500"></textarea>
      </div>
      <button (click)="submitBlog()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 shadow-md mt-4 transition-all">Submit for Review</button>
    </div>
  </div>
</div>
